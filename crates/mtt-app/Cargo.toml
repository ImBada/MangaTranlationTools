[package]
name = "mtt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MangaTranslationTools native editor"

[[bin]]
name = "manga-translation-tools"
path = "src/main.rs"

[features]
# Scripted UI automation (`MTT_AUTOMATION`, see src/automation.rs) for screenshots and
# self-tests. The packaging scripts build with `--no-default-features`, so the app users
# install ignores the variable; keep anything else out of `default`.
default = ["automation"]
automation = []

[dependencies]
mtt-core.workspace = true
mtt-render.workspace = true
mtt-inpaint.workspace = true
mtt-translate.workspace = true
anyhow.workspace = true
log.workspace = true
image.workspace = true
tiny-skia.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
eframe = "0.37"
egui = "0.37"
rfd = "0.17"
base64 = "0.22"
ureq = "3"
chrono.workspace = true
regex = "1"
unicode-normalization = "0.1"
tempfile.workspace = true

[dev-dependencies]

[lints]
workspace = true
